<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tenders Report - Pakistan</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; font-size: 28px; }
        .date-header { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e9ecef; }
        th { background-color: #34495e; color: white; text-transform: uppercase; font-size: 14px; }
        tr:hover { background-color: #f1f4f6; }
        .btn { display: inline-block; padding: 8px 16px; background: #27ae60; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Pakistan Tenders (Office, Stationery, Printing)</h1>
    <div class="date-header">Daily Automated Tender Dashboard</div>
    <table>
        <thead>
            <tr>
                <th>Tender Title</th>
                <th>Department</th>
                <th>Source</th>
                <th>Closing Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="5" style="text-align:center; padding: 30px; color: #7f8c8d;">
                    Script setup in progress. Daily automation will update tenders here every morning at 8:00 AM.
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
